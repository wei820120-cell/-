# 一次性探測（確認後刪除）：讀 Threads 帳號 bigmanj87（巨人傑）目前公開看得到的貼文與回覆，印出全文。
name: probe-threads
on:
  push:
    branches: [claude/funny-goodall-fft1u6]
    paths: [".github/workflows/probe-threads.yml"]
concurrency:
  group: probe-threads
  cancel-in-progress: true
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install playwright && playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from market_intel.fetchers import threads
          from datetime import datetime, timezone, timedelta
          got = threads.fetch_accounts(["bigmanj87"])
          posts = got.get("bigmanj87", [])
          print("POSTS", len(posts))
          tz = timezone(timedelta(hours=8))
          for p in posts:
              try:
                  t = datetime.fromisoformat(p.posted_at.replace("Z", "+00:00")).astimezone(tz).strftime("%m-%d %H:%M")
              except Exception:
                  t = p.posted_at
              print("=====", t, "|", p.author, "|", p.url, "| reply_to:", p.reply_to)
              print(p.text)
          PY
