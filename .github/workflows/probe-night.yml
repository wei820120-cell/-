# 一次性探測（確認後刪除）：夜盤報價過了午夜後 CDate／CTime 長什麼樣（夜盤狀態在 00:00 之後就沒有再更新）
name: probe-night
on:
  push:
    branches: [claude/funny-goodall-fft1u6]
    paths: [".github/workflows/probe-night.yml"]
concurrency:
  group: probe-night
  cancel-in-progress: true
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import time
          from market_intel.fetchers import txf
          from market_intel.utils import now_tw
          for i in range(3):
              rows = txf.fetch_rows(night=True)
              q = txf.parse(rows)
              print("now_tw", now_tw().isoformat(timespec="seconds"), "rows", len(rows))
              txs = [r for r in rows if str(r.get("SymbolID", "")).startswith("TXF") and "/" not in str(r.get("SymbolID", ""))]
              txs.sort(key=lambda r: -(float(str(r.get("CTotalVolume") or 0).replace(",", "") or 0)))
              for r in txs[:2]:
                  print("  ", {k: r.get(k) for k in ("SymbolID", "CDate", "CTime", "CLastPrice", "CTotalVolume", "CHighPrice", "CLowPrice", "COpenPrice")})
              print("  parsed", q and {k: (v.isoformat() if hasattr(v, "isoformat") else v) for k, v in q.items()})
              time.sleep(6)
          PY
