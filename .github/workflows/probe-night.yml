# 一次性探測：微台夜盤報價欄位（MIS 盤後）長什麼樣，確認後刪除。
name: probe-night

on:
  push:
    branches: ["claude/funny-goodall-fft1u6"]
    paths: [".github/workflows/probe-night.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: probe
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          URL = "https://mis.taifex.com.tw/futures/api/getQuoteList"
          def get(mt):
              body = {"MarketType": mt, "SymbolType": "F", "KindID": "1", "CID": "TXF", "ExpireMonth": "", "RowSize": "全部", "PageNo": "", "SortColumn": "", "AscDesc": "A"}
              req = urllib.request.Request(URL, data=json.dumps(body).encode(), headers={"Content-Type": "application/json", "Referer": "https://mis.taifex.com.tw/futures/", "Origin": "https://mis.taifex.com.tw", "User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          for mt in ("1", "0"):
              d = get(mt)
              rows = (d.get("RtData") or {}).get("QuoteList") or []
              print("== MarketType", mt, "rows", len(rows), "keys", sorted(rows[0].keys()) if rows else None)
              txf = [r for r in rows if str(r.get("SymbolID", "")).startswith("TXF") and "/" not in str(r.get("SymbolID", ""))]
              for r in txf[:3]:
                  print({k: r.get(k) for k in ("SymbolID", "CLastPrice", "COpenPrice", "CHighPrice", "CLowPrice", "CRefPrice", "CTotalVolume", "CDate", "CTime", "CTestTime", "DispCName")})
          print("== 3 samples, 20s apart (MarketType 1)")
          for i in range(3):
              rows = (get("1").get("RtData") or {}).get("QuoteList") or []
              txf = sorted([r for r in rows if str(r.get("SymbolID", "")).startswith("TXF") and "/" not in str(r.get("SymbolID", ""))], key=lambda r: -float(r.get("CTotalVolume") or 0))
              r = txf[0] if txf else {}
              print(time.strftime("%H:%M:%S"), r.get("SymbolID"), r.get("CLastPrice"), r.get("CHighPrice"), r.get("CLowPrice"), r.get("CDate"), r.get("CTime"), r.get("CTotalVolume"))
              time.sleep(20)
          PY
